name: perpex

services:
  redis:
    image: redis
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data
volumes:
  postgresdata:
  redisdata:
